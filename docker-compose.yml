# Banco local para desenvolvimento. Sem Docker: `npm run db:start`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evento
      POSTGRES_PASSWORD: evento_dev_password
      POSTGRES_DB: evento_brasil
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evento -d evento_brasil"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
