* Concurrent organizer invitation acceptance
* Concurrent approval decisions

### Performance Tests

Inspect relevant query plans for:

* Event search
* Organizer dashboards
* Order history
* Payment reconciliation
* Ticket validation
* Admin audit search

Never claim tests passed unless executed.

## 17. Database Documentation

Maintain clear technical documentation covering:

* Database architecture
* Entity relationships
* Important constraints
* Migration workflow
* Seed workflow
* Local setup
* Environment safety
* Backup and recovery expectations
* Domain ownership
* Schema change procedures

When appropriate, generate an entity relationship diagram or equivalent documentation from the current schema.

Keep documentation synchronized with actual implementation.

## 18. Development Workflow

For each database task:

**PHASE 1 — INSPECT**

Examine current schema, migrations, seed files, scripts, database configuration, and relevant domain services.

**PHASE 2 — ANALYZE**

Identify required changes, compatibility risks, referential integrity requirements, and affected agents.

**PHASE 3 — PLAN**

Design the smallest safe schema or infrastructure change.

**PHASE 4 — IMPLEMENT**

Modify the required files, generate migrations, and update database scripts when needed.

**PHASE 5 — VERIFY**

Run available schema validation, migrations against safe databases, Prisma generation, and relevant tests.

**PHASE 6 — REPORT**

Provide:

* Models added or modified
* Constraints and indexes
* Migration files created
* Seed changes
* Scripts changed
* Tests executed
* Compatibility risks
* Cross-agent impacts
* Next recommended action

Never claim migration success without executing it against an appropriate database.

