## 23. Project specifics (Evento Brasil)

This section maps the generic spec above to the real repository. Where they differ, **the real code wins**; do not create the suggested files (`src/lib/prisma.ts`, `scripts/db-*.sh`, `prisma/README.md`) if an existing file already covers the job.

### Versions and configuration
- PostgreSQL 17 (Docker image `postgres:17-alpine`, or embedded binaries without Docker). `.env.example` says 15+.
- Prisma **7** (`prisma` / `@prisma/client` / `@prisma/adapter-pg` ^7.10.1). Read the installed docs before using a Prisma command you have not checked for v7.
  - `prisma.config.ts` holds the schema path, migrations path, seed command (`tsx --conditions=react-server prisma/seed.ts`) and `datasource.url = env("DATABASE_URL")`.
  - Generator `prisma-client` with `output = "../src/generated/prisma"` (never edit generated files; import from `@/generated/prisma/client`).
  - Client factory: `createPrismaClient()` and `db` in `src/server/db.ts` (types `Db`, `Tx`, `TX_OPTIONS`). This is the equivalent of `src/lib/prisma.ts` in this spec.
- `postinstall` runs `prisma generate`.

### Local database (cross-platform)
| Option | How |
|---|---|
| Docker | `docker compose up -d` (`docker-compose.yml`, port **5433** → 5432, volume `pgdata`, health check) |
| No Docker (Windows/macOS/Linux) | `npm run db:start` → `scripts/dev-db.mjs` + `scripts/pg-local.mjs` (embedded PostgreSQL, data under `%TEMP%`/`os.tmpdir()/evento-brasil-pgdata/<port>` because of Windows path limits; detects an already-running server; refuses `NODE_ENV=production`) |
| One-click Windows installer | `INICIAR-EVENTO-BRASIL.bat` (+ `scripts/setup-helper.mjs`) |

Default dev URL: `postgresql://evento:…@localhost:5433/evento_brasil` (`.env.example`). Never commit `.env`.

Commands (`package.json`): `db:start`, `db:migrate` (`prisma migrate dev`), `db:deploy` (`prisma migrate deploy`), `db:seed` (`prisma db seed`), `db:status` (read-only: prints `user@host:port/db` without the password, checks connectivity, runs `prisma migrate status`), `db:reset -- --yes` (`scripts/db-reset.mjs`: `prisma migrate reset --force` + seed; refuses `NODE_ENV=production`, non-local hosts and a missing `--yes`), `db:generate`, `cities:import` (`scripts/import-ibge-cities.ts`). Quick inspection: `npx tsx --conditions=react-server scripts/db-summary.ts`. Full reference: `docs/database.md`.

### Test database
- `vitest.config.mts` points `DATABASE_URL` at `TEST_DATABASE_URL` or `postgresql://evento_test:…@localhost:5434/evento_test` (`TEST_DB_PORT`, default 5434).
- `tests/support/global-setup.ts` starts a **throwaway** embedded PostgreSQL per run (data dir under tmp, deleted afterwards) and runs `prisma migrate deploy`. With `TEST_DATABASE_URL` set it uses that database as-is — only point it at a disposable one.
- Integration suites in `tests/integration/` (`a-…` to `l-…`) hit the real database, including concurrency tests (overselling, last ticket, webhook dedupe, simultaneous check-in, duplicate payment, refund × check-in) and `checkFinancialInvariants`.

### Schema today (`prisma/schema.prisma`)
Models: `User`, `Session`, `Organization`, `OrganizationMember`, `OrganizationInvitation`, `OrganizerVerification`, `City`, `Venue`, `EventCategory`, `Event`, `EventImage`, `EventStaffAssignment`, `TicketType`, `TicketInventoryReservation`, `Order`, `OrderItem`, `Payment`, `PaymentWebhookEvent`, `SimulatedProviderPayment` (dev provider only), `IssuedTicket`, `TicketCheckin`, `Refund`, `CommissionRule`, `FinancialLedgerEntry`, `OrganizerSettlement`, `AuditLog`.
- Money is integer centavos (`…Cents`), percentages in basis points (`…Bps`).
- `PlatformRole` is only `USER | ADMIN`; `OrgRole` covers organization roles.
- There are no `ModerationCase`, `Permission`, `LedgerJournal` or reconciliation-record models. Ledger balance is enforced by the service + `checkFinancialInvariants` (`src/server/services/reconciliation.ts`), not by a journal table.

Migrations (applied — **never edit**):
1. `20261026001221_init`
2. `20261026001232_integrity_constraints` — hand-written SQL: CHECKs (no oversell `quantityReserved + quantitySold <= quantityTotal`, non-negative prices/amounts, refunds ≤ sold, event time order, commission bps/scope target, ledger amount > 0), the `FinancialLedgerEntry_immutable` trigger (blocks UPDATE/DELETE), and `Event_title_lower_idx`. Prisma does not model these; when you generate a new migration, check that the diff does not try to drop them.
3. `20261026001710_processing_fee_bearer` — dropped/re-created `CommissionRule.processingFeeBearer`. Note for the future: prefer expand-and-contract instead of drop/re-create.
4. `20261026150000_audit_log_append_only` — `AuditLog_immutable` trigger (`audit_log_block_mutation()`), blocks UPDATE/DELETE on `AuditLog`. Side effect: deleting a `User`/`Organization` referenced by audit rows fails (the FK `SET NULL` is an UPDATE).

### Seed (`prisma/seed.ts`)
- Refuses `NODE_ENV=production`. Creates the 27 state capitals + Franca, categories, demo users (`…@demo.eventobrasil.test`, password `DEMO_PASSWORD`), organizations, events, orders, tickets, a check-in and a refund through the **real services** (simulated payment provider).
- Safe to re-run: if `admin@demo.eventobrasil.test` exists it exits 0 without changes; if the database holds other users/organizations/orders it refuses (exit 1), because it starts by truncating every table. To recreate: `npm run db:reset -- --yes`.

### Known gaps (proposed priority)
1. ~~Append-only protection for `AuditLog`~~ — done (`20261026150000_audit_log_append_only`). Open with `admin`: LGPD policy (anonymize instead of delete).
2. Schema for admin sub-roles/permissions and moderation cases — only when `admin` asks, with an approved design.
3. ~~Idempotent seed and a guarded `db:reset`/`db:status`~~ — done.
4. Query-plan review (`EXPLAIN ANALYZE`) for event discovery by city/date/category, organizer dashboards, audit search; add indexes only with evidence.
5. ~~`docs/database.md`~~ — done; keep it in sync with every migration.

### Domain owners to consult before changing models
- Orders, reservations, payments, webhooks, refunds, ledger, commission, settlements → `pagamentos-financeiro` (`src/server/services/orders.ts`, `payments.ts`, `refunds.ts`, `ledger.ts`, `commission.ts`, `reconciliation.ts`, `cancellation.ts`).
- `IssuedTicket`, `TicketCheckin`, staff assignments → `check-in` (`tickets.ts`, `checkin.ts`).
- Organizations, members, invitations, events, ticket types → `area-organizador` (`organizers.ts`, `events.ts`, `reports.ts`).
- Public catalog, cities, categories → `paginas-publicas` (`catalog.ts`).
- `AuditLog`, approval states, admin roles → `admin` (`src/server/audit.ts`).

### Verifying a change
```bash
npx prisma validate
npx prisma format
npm run db:migrate -- --name <descricao>   # local dev database only
npx prisma migrate status
npm run db:generate
npm run typecheck
npm test                                  # migrates a throwaway test database
npm run build
```
Report a migration as verified only after `npm test` (or `migrate deploy` on a disposable database) actually ran it."""
