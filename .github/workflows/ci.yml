# Verificação automática de cada pull request e de cada push na main.
# Roda lint, typecheck, testes unitários, testes de integração (PostgreSQL real)
# e o build de produção. O job e2e roda a suíte Playwright isolada
# (scripts/test-e2e.mjs) contra um Postgres descartável, dividida em 2 partes
# paralelas: cada `next dev` compila metade das rotas (o acúmulo de memória da
# suíte inteira derrubava o servidor com "JS heap out of memory").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evento_test
          POSTGRES_PASSWORD: evento_test_pw
          POSTGRES_DB: evento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evento_test -d evento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores exclusivos de CI (não são segredos reais).
      DATABASE_URL: postgresql://evento_test:evento_test_pw@localhost:5432/evento_test
      TEST_DATABASE_URL: postgresql://evento_test:evento_test_pw@localhost:5432/evento_test
      APP_URL: https://evento.example
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_only_not_a_real_key
      EMAIL_FROM: Evento Brasil <notificacoes@evento.example>
      AUTH_SECRET: ci-only-auth-secret-0123456789
      DATA_ENCRYPTION_KEY: Y2ktb25seS1rZXktMDEyMzQ1Njc4OWFiY2RlZjAxMjM=
      CRON_SECRET: ci-only-cron-secret
      PAYMENT_PROVIDER: simulated
      SIMULATED_WEBHOOK_SECRET: ci-only-webhook-secret
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos de rotas do Next
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

      - name: Migrações (para o build)
        run: npx prisma migrate deploy

      - name: Build de produção
        env:
          # Build sem chamadas externas; preserva a proibição do simulador em produção.
          PAYMENT_PROVIDER: mercadopago
        run: npm run build

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evento_e2e
          POSTGRES_PASSWORD: evento_e2e_pw
          POSTGRES_DB: evento_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evento_e2e -d evento_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do job; o runner gera os demais segredos a cada execução.
      E2E_DATABASE_URL: postgresql://evento_e2e:evento_e2e_pw@localhost:5432/evento_e2e
      # O `prisma generate` do npm ci lê o prisma.config.ts, que exige DATABASE_URL.
      DATABASE_URL: postgresql://evento_e2e:evento_e2e_pw@localhost:5432/evento_e2e
      PW_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e:isolated -- --shard=${{ matrix.shard }}/2

      - name: Rastros das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
